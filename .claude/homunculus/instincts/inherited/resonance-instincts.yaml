# Resonance Workflow Feature Module Development

## Action

Follow the feature-module-development workflow:
1. Create or update feature directory under src/features/[feature-name]/
2. Add or update components in src/features/[feature-name]/components/
3. Add or update hooks in src/features/[feature-name]/hooks/
4. Add or update data/constants files in src/features/[feature-name]/data/ or data/constants.ts
5. Add or update views in src/features/[feature-name]/views/
6. Update or create related pages/layouts under src/app/(dashboard)/[feature-name]/
7. Update shared files if necessary (e.g., src/app/layout.tsx, src/features/dashboard/components/dashboard-sidebar.tsx)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: src/features/*/components/*.tsx, src/features/*/hooks/*.ts, src/features/*/data/*.ts

